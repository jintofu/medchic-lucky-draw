<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDCHIC - Lucky Draw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { medchic: '#0056b3' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-medchic text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold tracking-wide">MEDCHIC Lucky Draw</h1>
    </header>

    <!-- Main Content Area -->
    <main id="app-container" class="flex-grow flex items-center justify-center p-4">
        <!-- เนื้อหาจะถูกแทรกที่นี่ผ่าน JavaScript -->
    </main>

    <script src="script.js"></script>
</body>
</html>
